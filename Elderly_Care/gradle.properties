# ==============================================================
# Project-wide Gradle settings
# IDE (Android Studio) may override settings here — use ~/.gradle/gradle.properties to prevent that.
# ==============================================================

# === MEMORY & PERFORMANCE (LOW RAM) ===
# Keep the low-RAM base, but give D8/R8 enough heap to finish dexing
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Daemon is disabled for low-RAM machines (you can enable it later if you have >4 GB RAM)
org.gradle.daemon=true

# Parallel execution (safe)
org.gradle.parallel=true
org.gradle.configureondemand=true

# === D8 / R8 SPECIFIC HEAP (the fix for OutOfMemoryError) ===
# 4 GB is safe on most CI boxes; lower to 2g if you truly have <2 GB RAM
com.android.tools.build.gradle.d8.jvmargs=-Xmx4g

# Enable full R8 (helps shrink DEX size)
#android.enableR8=true
#android.enableR8.fullMode=true

# === PROXY (CORPORATE NETWORK) ===
#systemProp.http.proxyHost=10.93.228.170
#systemProp.http.proxyPort=8080
#systemProp.https.proxyHost=10.93.228.170
#systemProp.https.proxyPort=8080

# === ANDROID DEFAULTS (Keep these) ===
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

#kotlin.daemon.enabled=false

